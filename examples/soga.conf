# Replace the fictional endpoint, API key and node ID before starting.
type=soga-v1
server_type=vmess
api=webapi
node_id=1
webapi_url=https://panel.example.invalid
webapi_key=replace-with-your-panel-api-key
listen=::
auto_update=false
# Explicit independent paths keep reconstruction state separate.
log_file_dir=/etc/soga-reconstructed/logs
ip_user_cache_save_dir=/etc/soga-reconstructed/state
forbidden_ports=25,465
log_level=info

# Optional recovered tunnel. Use a strong unique tunnel password.
# The inner node's protocol/TLS/transport settings still apply.
# tunnel_enable=true
# tunnel_type=ws-tunnel
# tunnel_method=aes-128-gcm
# tunnel_password=replace-with-a-unique-tunnel-password
# tunnel_mux=true
# tunnel_ws_path=/pass
# tls-tunnel / ws-tls-tunnel also require your cert_file and key_file,
# or the normal cert_mode/cert_domain issuance settings.
