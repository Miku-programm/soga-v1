name: Build Linux programs

# Every branch and pull request is built and tested. Only main publishes:
# pushes become preview pre-releases, and a stable "latest" release (the one
# install.sh and `soga update` use by default) needs a manual run with
# channel=stable after the preview has been checked.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        default: stable
        options: [stable, preview]

permissions:
  contents: write

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Vet and test Go packages
        env:
          GOFLAGS: -mod=vendor
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
        run: |
          go vet ./...
          go test -timeout 20m ./...
      - name: Build Linux amd64 and arm64 offline
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
        run: sh scripts/build.sh all
      - name: Check the amd64 program
        run: |
          python3 scripts/smoke.py bin/soga-reconstructed-linux-amd64 --output ci-results/cli.json
          python3 scripts/runtime_smoke.py bin/soga-reconstructed-linux-amd64 --output ci-results/runtime.json
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Package programs, source, and checksums
        env:
          CHANNEL: ${{ inputs.channel || 'preview' }}
        run: |
          mkdir -p dist
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          channel = os.environ["CHANNEL"]
          prefix = "preview" if channel == "preview" else "build"
          tag = f'{prefix}-{os.environ["GITHUB_RUN_NUMBER"]}-{os.environ["GITHUB_RUN_ATTEMPT"]}-{os.environ["GITHUB_SHA"][:7]}'
          Path("BUILD-INFO.json").write_text(json.dumps({"tag": tag, "channel": channel, "commit": os.environ["GITHUB_SHA"]}) + "\n")
          PY
          for arch in amd64 arm64; do
            tar -czf "dist/soga-linux-${arch}.tar.gz" \
              --transform 's,^,soga-reconstructed/,' \
              "bin/soga-reconstructed-linux-${arch}" examples scripts \
              LICENSE LICENSES THIRD_PARTY_NOTICES.txt README.md GITHUB.md docs BUILD-INFO.json
          done
          git archive --format=tar.gz --prefix=soga-reconstructed/ \
            --output=dist/soga-source.tar.gz HEAD
          cp bin/soga-reconstructed-linux-* dist/
          cp ci-results/*.json dist/
          cp scripts/manager.py dist/soga-manager.py
          cp install.sh dist/soga-install.sh
          cd dist
          sha256sum soga-* *.json > SHA256SUMS
      - name: Check one-command installer without changing this runner
        run: bash scripts/check-release-install.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: soga-linux-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
      - name: Publish downloadable build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CHANNEL: ${{ inputs.channel || 'preview' }}
        run: |
          tag=$(python3 -c 'import json; print(json.load(open("BUILD-INFO.json"))["tag"])')
          cat > release-notes.txt <<'NOTES'
          Independent soga-reconstructed build; not the original author's source.
          Linux amd64 and arm64, plus complete source and third-party licenses.
          go vet, Go unit tests and amd64 CLI/local-process smoke checks passed;
          arm64 is cross-compiled.
          This workflow does not repeat the historical full integration suite.
          v2node API routing is unchanged at the user's request. See GITHUB.md
          for configuration keys and known compatibility limitations.
          NOTES
          flags=(--latest)
          if [[ "$CHANNEL" == preview ]]; then flags=(--prerelease); fi
          gh release create "$tag" dist/* --repo "$REPOSITORY" \
            --target "$GITHUB_SHA" --title "Linux build ${GITHUB_SHA:0:7}" \
            --notes-file release-notes.txt "${flags[@]}"
