services:
  soga-reconstructed:
    build:
      context: .
      dockerfile: Dockerfile
    image: soga-reconstructed:local
    # 本示例针对 Linux Docker Engine。监听端口由面板节点配置决定。
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      TZ: Asia/Shanghai
    volumes:
      - type: bind
        source: ./deploy
        target: /etc/soga-reconstructed
        bind:
          create_host_path: false
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
